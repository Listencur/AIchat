<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI对话聚合</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="window-bar" id="windowBar">
    <div class="window-bar-left">
      <div class="header-actions">
        <button class="icon-button sidebar-toggle" id="btnSidebarToggle" title="隐藏模型栏" aria-label="隐藏模型栏">
          <span></span>
        </button>
        <button class="icon-button" id="btnTheme" title="切换浅色模式" aria-label="切换浅色模式">☾</button>
        <button class="icon-button" id="btnStatus" title="模型状态" aria-label="模型状态">◉</button>
        <button class="icon-button" id="btnSettings" title="设置" aria-label="设置">⚙</button>
      </div>
    </div>
    <div class="window-drag-region" aria-hidden="true">
      <span class="window-title" id="windowTitle"></span>
    </div>
    <div class="window-controls">
      <button class="window-control" id="btnWindowMinimize" type="button" title="最小化" aria-label="最小化">−</button>
      <button class="window-control" id="btnWindowMaximize" type="button" title="最大化/还原" aria-label="最大化/还原">□</button>
      <button class="window-control window-control-close" id="btnWindowClose" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
  </header>

  <div class="app">
    <!-- ── 侧边栏 ── -->
    <aside class="sidebar" id="sidebar">
      <section class="group-section">
        <div class="section-header">
          <span>场景</span>
          <button class="mini-button" id="btnAddGroup" type="button" title="添加分组" aria-label="添加分组">+</button>
        </div>
        <nav class="group-list" id="groupList"></nav>
      </section>

      <nav class="model-list" id="modelList">
        <!-- 模型项由 renderer.js 动态渲染 -->
      </nav>

      <div class="context-menu" id="modelContextMenu" hidden>
        <button type="button" data-action="edit">编辑模型</button>
        <button type="button" data-action="close">结束并释放内存</button>
        <button type="button" data-action="delete" class="danger">删除模型</button>
      </div>

      <div class="sidebar-footer">
        <button class="btn-tool" id="btnExportConversation" type="button">
          <span class="btn-icon">⇩</span>
          <span>导出对话</span>
        </button>
        <div class="split-panel" id="splitPanel">
          <button class="btn-tool" id="btnToggleSplit" type="button">
            <span class="btn-icon">▦</span>
            <span>分屏</span>
          </button>
          <div class="split-actions" id="splitActions" hidden>
            <span class="split-hint" id="splitHint">选择 2-3 个模型</span>
            <div class="split-direction" id="splitDirection">
              <button class="btn-text active" id="btnSplitHorizontal" type="button" title="左右分屏" aria-label="左右分屏">↔</button>
              <button class="btn-text" id="btnSplitVertical" type="button" title="上下分屏" aria-label="上下分屏">↕</button>
            </div>
            <button class="btn-text" id="btnRestoreSplit" type="button" hidden>恢复分屏</button>
            <button class="btn-text" id="btnExitSplit" type="button">退出</button>
          </div>
        </div>
        <button class="btn-add-model" id="btnAddModel">
          <span class="btn-icon">+</span>
          <span>添加模型</span>
        </button>
      </div>
    </aside>

    <!-- ── 主区域（WebView 覆盖在此区域上方） ── -->
    <main class="main-area" id="mainArea">
      <div class="main-placeholder" id="mainPlaceholder">
        <div class="placeholder-content">
          <div class="loading-spinner" aria-hidden="true"></div>
          <p id="placeholderText">从左侧选择一个 AI 模型开始对话</p>
          <button class="placeholder-action" id="btnPlaceholderRefresh" type="button" hidden>刷新</button>
        </div>
      </div>
      <div class="split-resizers" id="splitResizers" hidden></div>
    </main>
  </div>

  <!-- ── 模型状态弹窗 ── -->
  <div class="modal-overlay" id="modalStatus">
    <div class="modal modal-status">
      <div class="modal-header">
        <h2>模型状态</h2>
        <button class="modal-close" id="btnCloseStatus">&times;</button>
      </div>
      <div class="modal-body status-body">
        <div class="status-toolbar">
          <div class="status-summary" id="statusSummary">读取中</div>
          <div class="status-actions">
            <button type="button" class="btn-small" id="btnRefreshStatus">刷新</button>
            <button type="button" class="btn-small" id="btnCloseInactiveModels">结束后台</button>
          </div>
        </div>
        <div class="status-list" id="statusList"></div>
      </div>
    </div>
  </div>

  <!-- ── 添加分组弹窗 ── -->
  <div class="modal-overlay" id="modalAddGroup">
    <div class="modal modal-group">
      <div class="modal-header">
        <h2>添加场景分组</h2>
        <button class="modal-close" id="btnCloseGroupModal">&times;</button>
      </div>
      <form class="modal-body" id="addGroupForm">
        <label class="form-row">
          <span class="form-label">名称</span>
          <input type="text" id="inputGroupName" name="name" placeholder="如：编程组" required maxlength="30" />
        </label>
        <div class="form-row">
          <span class="form-label">模型</span>
          <div class="check-list" id="groupModelChecks"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btnCancelGroupAdd">取消</button>
          <button type="submit" class="btn-confirm">添加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 设置弹窗 ── -->
  <div class="modal-overlay" id="modalSettings">
    <div class="modal modal-settings">
      <div class="modal-header">
        <h2>设置</h2>
        <button class="modal-close" id="btnCloseSettings">&times;</button>
      </div>
      <form class="modal-body" id="settingsForm">
        <fieldset class="settings-group">
          <legend>会话</legend>
          <label class="toggle-row">
            <input type="checkbox" id="inputRestoreSnapshot" name="restoreSnapshot" />
            <span>
              <strong>启动时恢复上次会话</strong>
              <small>恢复上次打开的模型、分屏布局和页面位置</small>
            </span>
          </label>
        </fieldset>
        <fieldset class="settings-group">
          <legend>组合键</legend>
          <label class="toggle-row">
            <input type="checkbox" id="inputShortcutEnabled" name="shortcutEnabled" />
            <span>
              <strong>启用全局快捷键</strong>
              <small>在任意位置唤起快速输入窗口</small>
            </span>
          </label>
          <label class="form-row">
            <span class="form-label">组合键</span>
            <input type="text" id="inputShortcutAccelerator" name="shortcutAccelerator" placeholder="Ctrl+Shift+Space" />
          </label>
        </fieldset>
        <fieldset class="settings-group">
          <legend>关闭窗口</legend>
          <label class="radio-row">
            <input type="radio" name="closeAction" value="ask" />
            <span>
              <strong>每次询问</strong>
              <small>关闭窗口时询问最小化到托盘或退出程序</small>
            </span>
          </label>
          <label class="radio-row">
            <input type="radio" name="closeAction" value="minimize" />
            <span>
              <strong>默认最小化</strong>
              <small>关闭窗口时直接最小化到系统托盘</small>
            </span>
          </label>
          <label class="radio-row">
            <input type="radio" name="closeAction" value="quit" />
            <span>
              <strong>默认退出</strong>
              <small>关闭窗口时直接退出程序</small>
            </span>
          </label>
        </fieldset>
        <fieldset class="settings-group">
          <legend>代理</legend>
          <label class="radio-row">
            <input type="radio" name="proxyMode" value="system" />
            <span>
              <strong>系统代理</strong>
              <small>默认使用系统网络代理设置</small>
            </span>
          </label>
          <label class="radio-row">
            <input type="radio" name="proxyMode" value="custom" />
            <span>
              <strong>自定义代理</strong>
              <small>例如 http://127.0.0.1:7897</small>
            </span>
          </label>
          <label class="form-row proxy-url-row" id="proxyUrlRow">
            <span class="form-label">代理地址</span>
            <input type="text" id="inputProxyUrl" name="proxyUrl" placeholder="http://127.0.0.1:7897" />
          </label>
          <label class="radio-row">
            <input type="radio" name="proxyMode" value="direct" />
            <span>
              <strong>直连</strong>
              <small>不使用代理</small>
            </span>
          </label>
        </fieldset>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btnCancelSettings">取消</button>
          <button type="submit" class="btn-confirm">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 添加模型弹窗 ── -->
  <div class="modal-overlay" id="modalAddModel">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modelModalTitle">添加 AI 模型</h2>
        <button class="modal-close" id="btnCloseModal">&times;</button>
      </div>
      <form class="modal-body" id="addModelForm">
        <label class="form-row">
          <span class="form-label">名称</span>
          <input type="text" id="inputName" name="name" placeholder="如：Claude" required maxlength="30" />
        </label>
        <label class="form-row">
          <span class="form-label">网址</span>
          <input type="url" id="inputUrl" name="url" placeholder="https://claude.ai" required />
        </label>
        <label class="form-row">
          <span class="form-label">图标 (可选)</span>
          <input type="text" id="inputIcon" name="icon" placeholder="🤖" maxlength="4" />
        </label>
        <label class="form-row">
          <span class="form-label">图标地址 (可选)</span>
          <input type="text" id="inputIconUrl" name="iconUrl" placeholder="自动使用网站 favicon" />
          <div class="icon-picker-row">
            <span class="icon-preview" id="modelIconPreview">🤖</span>
            <button type="button" class="btn-small" id="btnPickLocalIcon">选择本地图标</button>
            <button type="button" class="btn-small" id="btnClearIcon">清除</button>
            <span class="icon-file-name" id="localIconName"></span>
          </div>
        </label>
        <label class="form-row">
          <span class="form-label">主题色 (可选)</span>
          <input type="color" id="inputColor" name="color" value="#666666" />
        </label>
        <div class="modal-footer">
          <button type="button" class="btn-delete-model" id="btnDeleteModel" hidden>删除</button>
          <button type="button" class="btn-cancel" id="btnCancelAdd">取消</button>
          <button type="submit" class="btn-confirm" id="btnSubmitModel">添加</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/settings.js"></script>
  <script src="js/add-model.js"></script>
  <script src="js/renderer.js"></script>
</body>
</html>
