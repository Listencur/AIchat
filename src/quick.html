<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快速提问</title>
  <link rel="stylesheet" href="css/quick.css" />
</head>
<body>
  <main class="quick-shell">
    <form class="quick-form" id="quickForm">
      <textarea id="quickPrompt" rows="3" placeholder="Enter 提交，Shift+Enter 换行"></textarea>
      <footer class="quick-toolbar">
        <div class="quick-model-picker" id="quickModelPicker">
          <button class="quick-model-trigger" id="quickModelTrigger" type="button" aria-label="模型">暂无模型</button>
          <div class="quick-model-menu" id="quickModelMenu" hidden></div>
        </div>
        <div class="quick-actions">
          <button class="quick-pin" id="btnQuickPin" type="button" aria-label="置顶">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5" />
              <path d="M5 17h14" />
              <path d="m15 3.5-1 5.5 3 3v1H7v-1l3-3-1-5.5" />
            </svg>
          </button>
          <button class="quick-send" id="btnQuickSubmit" type="submit" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5" />
              <path d="m6 11 6-6 6 6" />
            </svg>
          </button>
        </div>
      </footer>
    </form>
  </main>
  <script src="js/quick.js"></script>
</body>
</html>
