<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快速提问</title>
  <link rel="stylesheet" href="css/quick.css" />
</head>
<body>
  <main class="quick-shell">
    <form class="quick-form" id="quickForm">
      <textarea id="quickPrompt" rows="3" placeholder="Enter 提交，Shift+Enter 换行"></textarea>
      <footer class="quick-toolbar">
        <select id="quickModelSelect" aria-label="模型"></select>
        <div class="quick-actions">
          <button class="quick-pin" id="btnQuickPin" type="button" aria-label="置顶">⌖</button>
          <button class="quick-send" id="btnQuickSubmit" type="submit" aria-label="发送">
            <span>↑</span>
          </button>
        </div>
      </footer>
    </form>
  </main>
  <script src="js/quick.js"></script>
</body>
</html>
